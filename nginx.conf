# ==============================================================================
# NGINX VIRTUAL HOST CONFIGURATION FOR ISTANADOLUDEED.COM (TR & RU MULTI-LANG)
# Location on Server: /etc/nginx/sites-available/deed
# ==============================================================================

# Map Accept-Language header for automatic language detection at root (/)
map $http_accept_language $lang_target {
    default     /tr/;
    ~*^ru       /ru/;
    ~*^tr       /tr/;
}

server {
    server_name istanadoludeed.com www.istanadoludeed.com;

    root /var/www/deed;

    # --------------------------------------------------------------------------
    # Security Headers & Gzip Compression
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # --------------------------------------------------------------------------
    # Root Redirect: Sends visitors to /ru/ or /tr/ based on Accept-Language
    # (No main index.html file required)
    # --------------------------------------------------------------------------
    location = / {
        return 302 $lang_target;
    }

    # --------------------------------------------------------------------------
    # Clean URL Format (/tr -> /tr/, /ru -> /ru/)
    # --------------------------------------------------------------------------
    location = /tr {
        return 301 /tr/;
    }

    location = /ru {
        return 301 /ru/;
    }

    # --------------------------------------------------------------------------
    # 1. Turkish Page Serving (/tr/)
    # --------------------------------------------------------------------------
    location /tr/ {
        alias /var/www/deed/tr/;
        index index.html;
        try_files $uri $uri/ /tr/index.html;
    }

    # --------------------------------------------------------------------------
    # 2. Russian Page Serving (/ru/)
    # --------------------------------------------------------------------------
    location /ru/ {
        alias /var/www/deed/ru/;
        index index.html;
        try_files $uri $uri/ /ru/index.html;
    }

    # --------------------------------------------------------------------------
    # Shared Static Assets (/images/)
    # --------------------------------------------------------------------------
    location /images/ {
        alias /var/www/deed/images/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Fallback static asset caching
    location ~* \.(png|jpg|jpeg|gif|ico|svg|css|js|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Certbot Managed SSL Settings
    # --------------------------------------------------------------------------
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/istanadoludeed.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/istanadoludeed.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.istanadoludeed.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = istanadoludeed.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name istanadoludeed.com www.istanadoludeed.com;
    return 404; # managed by Certbot
}
