# ==============================================================================
# LOCAL NGINX CONFIGURATION FOR DOCKER (HOST: http://localhost:8080)
# Mounted into Docker container at: /etc/nginx/conf.d/default.conf
# ==============================================================================

# Map Accept-Language header for automatic language detection at root (/)
map $http_accept_language $lang_target {
    default     /tr/;
    ~*^ru       /ru/;
    ~*^tr       /tr/;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost 127.0.0.1;

    # Prevent Nginx from stripping host port (8080) on redirects
    absolute_redirect off;

    root /var/www/deed;

    # Gzip Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # Root Redirect: Sends visitors to /ru/ or /tr/ based on Accept-Language
    location = / {
        return 302 $lang_target;
    }

    # Clean URL Format (/tr -> /tr/, /ru -> /ru/)
    location = /tr {
        return 301 /tr/;
    }

    location = /ru {
        return 301 /ru/;
    }

    # 1. Turkish Page Serving (/tr/)
    location /tr/ {
        alias /var/www/deed/tr/;
        index index.html;
        try_files $uri $uri/ /tr/index.html;
    }

    # 2. Russian Page Serving (/ru/)
    location /ru/ {
        alias /var/www/deed/ru/;
        index index.html;
        try_files $uri $uri/ /ru/index.html;
    }

    # Shared Static Assets (/images/)
    location /images/ {
        alias /var/www/deed/images/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Fallback static asset caching
    location ~* \.(png|jpg|jpeg|gif|ico|svg|css|js|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }
}
